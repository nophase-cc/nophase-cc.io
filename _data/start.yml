# Start page (home) configuration.

# Optional announcement shown above the wordmark. Remove `news` to hide it.
news:
  label: new
  text: MIDIBRAIN 0.1 is public
  url: /projects/midi-brain/

# `search` is where launcher text goes when you pick the web row, or when
# nothing on the page matches. Use {q} for the query. Prefixes pick an engine:
# "g cats", "yt synth", "gh jucelib", ...
search:
  default: https://duckduckgo.com/?q={q}
  label: DuckDuckGo
  prefixes:
    g: https://www.google.com/search?q={q}
    ddg: https://duckduckgo.com/?q={q}
    yt: https://www.youtube.com/results?search_query={q}
    gh: https://github.com/search?q={q}
    mdn: https://developer.mozilla.org/en-US/search?q={q}
    fs: https://freesound.org/search/?q={q}
    kvr: https://www.kvraudio.com/search?q={q}
    cve: https://www.cve.org/CVERecord/SearchResults?query={q}
    vt: https://www.virustotal.com/gui/search/{q}
    shodan: https://www.shodan.io/search?query={q}

# Link groups on the home page. The grid is four across, so keep the group
# count a multiple of four and each group the same length (8 x 8 right now):
# top row is the music side, bottom row the security / network side.
# Fields: `name`, `url`, `icon` (Font Awesome class) and optional `keys`
# (extra words the launcher should match). NOPHASE's own pages live in the
# sidebar and project cards, so this list is for everything else. Prefer things
# you open often over docs that are one search away.
