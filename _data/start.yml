# Start page (home) configuration.
#
# `search` is where text that doesn't match a link goes. Use {q} for the query.
# Prefixes let you pick an engine: "g cats", "yt synth", "gh jucelib", ...
search:
  default: https://duckduckgo.com/?q={q}
  label: DuckDuckGo
  prefixes:
    g: https://www.google.com/search?q={q}
    ddg: https://duckduckgo.com/?q={q}
    yt: https://www.youtube.com/results?search_query={q}
    gh: https://github.com/search?q={q}
    mdn: https://developer.mozilla.org/en-US/search?q={q}
    fs: https://freesound.org/search/?q={q}
    kvr: https://www.kvraudio.com/search?q={q}

# Link groups shown on the home page. Edit freely: `name`, `url`, `icon` (Font
